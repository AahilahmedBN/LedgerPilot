<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LedgerPilot — Compliance Co-Pilot</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-3xl mx-auto px-6 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900">LedgerPilot</h1>
      <p class="text-slate-500 mt-1">AI Compliance Co-Pilot for Indian MSMEs — GST categorization, ITC eligibility, and penalty-risk assessment.</p>
    </header>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
      <div class="flex gap-2 mb-6">
        <button id="tab-text" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 text-white">Enter Manually</button>
        <button id="tab-image" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600">Upload Receipt</button>
      </div>

      <!-- Manual entry form -->
      <div id="panel-text">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Transaction Description</label>
            <input id="description" type="text" placeholder="e.g. Monthly Rent - Shop Premises"
              class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
              <input id="amount" type="number" placeholder="18500"
                class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Transaction Date</label>
              <input id="txn-date" type="date"
                class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-4 text-sm">
            <label class="flex items-center gap-2"><input id="claimed-itc" type="checkbox" checked> Claiming ITC</label>
            <label class="flex items-center gap-2"><input id="valid-gstin" type="checkbox" checked> Valid GSTIN</label>
            <label class="flex items-center gap-2"><input id="intra-state" type="checkbox" checked> Intra-state</label>
          </div>
          <button id="submit-text" class="w-full bg-slate-900 text-white rounded-lg py-2.5 font-medium hover:bg-slate-800 transition">
            Analyze Transaction
          </button>
        </div>
      </div>

      <!-- Image upload form -->
      <div id="panel-image" class="hidden">
        <div class="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center">
          <input id="file-input" type="file" accept="image/*" class="hidden">
          <button id="pick-file" class="text-slate-700 font-medium underline">Choose a receipt image</button>
          <p id="file-name" class="text-sm text-slate-400 mt-2"></p>
        </div>
        <button id="submit-image" class="w-full mt-4 bg-slate-900 text-white rounded-lg py-2.5 font-medium hover:bg-slate-800 transition">
          Upload &amp; Analyze
        </button>
      </div>
    </div>

    <div id="loading" class="hidden text-center text-slate-400 py-6">Analyzing…</div>
    <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-6"></div>
    <div id="result" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6"></div>
  </div>

<script>
const API_BASE = "http://127.0.0.1:5000";

const tabText = document.getElementById("tab-text");
const tabImage = document.getElementById("tab-image");
const panelText = document.getElementById("panel-text");
const panelImage = document.getElementById("panel-image");

tabText.onclick = () => {
  tabText.className = "tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 text-white";
  tabImage.className = "tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600";
  panelText.classList.remove("hidden");
  panelImage.classList.add("hidden");
};
tabImage.onclick = () => {
  tabImage.className = "tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 text-white";
  tabText.className = "tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600";
  panelImage.classList.remove("hidden");
  panelText.classList.add("hidden");
};

document.getElementById("pick-file").onclick = () => document.getElementById("file-input").click();
document.getElementById("file-input").onchange = (e) => {
  const f = e.target.files[0];
  document.getElementById("file-name").textContent = f ? f.name : "";
};

function showLoading(on) {
  document.getElementById("loading").classList.toggle("hidden", !on);
}
function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg;
  el.classList.remove("hidden");
}
function clearMessages() {
  document.getElementById("error").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
}

function riskBadgeClass(level) {
  if (level === "Low") return "bg-emerald-100 text-emerald-700";
  if (level === "Medium") return "bg-amber-100 text-amber-700";
  return "bg-red-100 text-red-700";
}
function itcBadgeClass(status) {
  if (status === "Eligible") return "bg-emerald-100 text-emerald-700";
  if (status === "Blocked") return "bg-red-100 text-red-700";
  return "bg-slate-100 text-slate-600";
}

function renderResult(data) {
  if (data.error) {
    showError(data.error);
    return;
  }
  const el = document.getElementById("result");
  el.innerHTML = `
    <div class="flex justify-between items-start mb-4">
      <div>
        <p class="text-sm text-slate-400">Transaction ${data.transaction_id}</p>
        <p class="text-lg font-semibold text-slate-900">${data.description}</p>
      </div>
      <p class="text-2xl font-bold text-slate-900">₹${Number(data.amount).toLocaleString("en-IN")}</p>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
      <div class="bg-slate-50 rounded-xl p-4">
        <p class="text-xs text-slate-400 mb-1">Category</p>
        <p class="font-medium text-slate-900">${data.category}</p>
        <p class="text-xs text-slate-400 mt-1">Confidence: ${(data.categorization_confidence * 100).toFixed(1)}%
          ${data.categorization_needs_review ? '<span class="text-amber-600 font-medium">— Needs Review</span>' : ""}</p>
      </div>
      <div class="bg-slate-50 rounded-xl p-4">
        <p class="text-xs text-slate-400 mb-1">Risk Level</p>
        <span class="inline-block px-2.5 py-1 rounded-full text-sm font-medium ${riskBadgeClass(data.risk_level)}">${data.risk_level}</span>
      </div>
    </div>

    <div class="bg-slate-50 rounded-xl p-4 mb-4">
      <p class="text-xs text-slate-400 mb-2">GST (${data.gst_rate}${data.gst_rate !== "exempt" ? "%" : ""})</p>
      <div class="grid grid-cols-3 gap-2 text-sm">
        <div><span class="text-slate-400">CGST:</span> ₹${data.gst_split.cgst}</div>
        <div><span class="text-slate-400">SGST:</span> ₹${data.gst_split.sgst}</div>
        <div><span class="text-slate-400">IGST:</span> ₹${data.gst_split.igst}</div>
      </div>
    </div>

    <div class="bg-slate-50 rounded-xl p-4">
      <div class="flex items-center gap-2 mb-1">
        <p class="text-xs text-slate-400">Input Tax Credit</p>
        <span class="px-2 py-0.5 rounded-full text-xs font-medium ${itcBadgeClass(data.itc_eligible)}">${data.itc_eligible}</span>
      </div>
      <p class="text-sm text-slate-600">${data.itc_reason}</p>
    </div>

    ${data.ocr_text ? `
    <div class="mt-4 bg-slate-50 rounded-xl p-4">
      <p class="text-xs text-slate-400 mb-1">OCR Extracted Text (confidence: ${data.ocr_confidence}%)</p>
      <pre class="text-xs text-slate-500 whitespace-pre-wrap">${data.ocr_text}</pre>
    </div>` : ""}
  `;
  el.classList.remove("hidden");
}

document.getElementById("submit-text").onclick = async () => {
  clearMessages();
  const description = document.getElementById("description").value.trim();
  const amount = document.getElementById("amount").value;
  if (!description || !amount) {
    showError("Please enter both a description and an amount.");
    return;
  }
  const payload = {
    description,
    amount: parseFloat(amount),
    is_intra_state: document.getElementById("intra-state").checked,
    claimed_itc: document.getElementById("claimed-itc").checked,
    has_valid_gstin: document.getElementById("valid-gstin").checked,
  };
  const dateVal = document.getElementById("txn-date").value;
  if (dateVal) payload.transaction_date = dateVal;

  showLoading(true);
  try {
    const res = await fetch(`${API_BASE}/api/analyze-text`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    renderResult(data);
  } catch (err) {
    showError("Could not reach the LedgerPilot server. Is app.py running on port 5000?");
  } finally {
    showLoading(false);
  }
};

document.getElementById("submit-image").onclick = async () => {
  clearMessages();
  const file = document.getElementById("file-input").files[0];
  if (!file) {
    showError("Please choose a receipt image first.");
    return;
  }
  const formData = new FormData();
  formData.append("document", file);

  showLoading(true);
  try {
    const res = await fetch(`${API_BASE}/api/analyze-image`, { method: "POST", body: formData });
    const data = await res.json();
    renderResult(data);
  } catch (err) {
    showError("Could not reach the LedgerPilot server. Is app.py running on port 5000?");
  } finally {
    showLoading(false);
  }
};
</script>
</body>
</html>
